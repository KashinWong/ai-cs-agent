name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: uv pip install --system -e '.[dev]'
      - name: Ruff lint
        run: ruff check backend tests scripts
      - name: Unit tests (domain pure functions)
        run: python -m pytest tests/unit -q
      - name: Compose config validation
        run: docker compose config >/dev/null
